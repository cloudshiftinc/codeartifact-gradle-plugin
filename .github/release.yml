# Categories for GitHub's auto-generated release notes (gh release create --generate-notes).
# release-please writes its own notes for regular releases; this applies to manual releases.
changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Bug Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other Changes
      labels: ["*"]
