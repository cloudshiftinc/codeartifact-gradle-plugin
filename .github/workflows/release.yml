name: Release CodeArtifact plugin

# On every push to main, release-please maintains a release PR that bumps the version in
# gradle.properties and updates CHANGELOG.md from Conventional Commits. Merging that PR creates
# the vX.Y.Z tag and GitHub Release, and the publish job then pushes to the Gradle Plugin Portal.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # https://github.com/googleapis/release-please-action
      - name: Run release-please
        id: release
        uses: "googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7" # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dependency-graph:
    name: dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      # https://github.com/gradle/actions/tree/main/dependency-submission
      - name: "Generate and submit dependency graph"
        uses: "gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c" # v6.4.1
        env:
          DEPENDENCY_GRAPH_EXCLUDE_PROJECTS: "^:(build-logic|buildSrc|.*[Tt]test.*)"
          DEPENDENCY_GRAPH_EXCLUDE_CONFIGURATIONS: ".*[Tt]est.*Classpath"

  publish:
    name: publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      # https://github.com/gradle/actions/tree/main/setup-gradle
      - name: Setup Gradle
        uses: 'gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c' # v6.4.1

      - name: Build and publish
        env:
          GRADLE_PUBLISH_KEY: '${{ secrets.PLUGIN_PORTAL_KEY }}'
          GRADLE_PUBLISH_SECRET: '${{ secrets.PLUGIN_PORTAL_SECRET }}'
          ORG_GRADLE_PROJECT_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_SIGNING_PWD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew build publishPlugins --no-configuration-cache

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" build/libs/*.jar --clobber
